<!DOCTYPE html>
<html>
<head>

    <title>IDC Executive Dinner Registration</title>

  <style>

body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    color:#111;
}

.hero{
    background:#1f3faa;
    padding:80px 20px;
    color:white;
}

.hero-inner{
    max-width:800px;
    margin:auto;
}

.logo{
    width:90px;
    margin-bottom:30px;
}

.event-type{
    font-size:13px;
    font-weight:bold;
    letter-spacing:1px;
}

.hero h1{
    font-size:48px;
    line-height:1.2;
    margin:20px 0;
}

.event-date{
    font-size:22px;
    margin-bottom:30px;
}

.register-btn{
    background:#3d6cff;
    color:white;
    border:none;
    padding:14px 28px;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
}

.form-section{
    padding:80px 20px;
    max-width:1000px;
    margin:auto;
}

.form-container{
    max-width:900px;
    margin:auto;
}

.form-container h2{
    text-align:center;
    font-size:46px;
    color:#2a1485;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    margin-bottom:50px;
    color:#555;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:25px;
    margin-bottom:25px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field label{
    font-size:13px;
    margin-bottom:8px;
    color:#222;
}

.field input{
    padding:14px;
    border:1px solid #ccc;
    border-radius:4px;
    font-size:14px;
}

.full-width{
    margin-bottom:25px;
}

.address-title{
    margin:40px 0 25px;
    font-size:30px;
    color:#111;
}

.button-wrap{
    text-align:center;
    margin-top:40px;
}

.button-wrap button{
    background:#3d6cff;
    color:white;
    border:none;
    padding:14px 36px;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
}

@media(max-width:768px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-container h2{
        font-size:34px;
    }

}
      
.footer{
    background:#2450d3;
    height:180px;
}

@media(max-width:768px){

    .hero h1{
        font-size:34px;
    }

    .event-date{
        font-size:18px;
    }

}

</style>

</head>

<body>

<header class="hero">

    <div class="hero-inner">

        <img src="logo.png" class="logo">

        <p class="event-type">EXECUTIVE DINNER</p>

        <h1>
            Scaling Agentic AI: From Experimentation to Enterprise Value Through Modernization and Trust
        </h1>

        <p class="event-date">
            Tuesday, May 19, 2026
        </p>

        <button class="register-btn">
            Register Now
        </button>

    </div>

</header>

<section class="form-section">

    <div class="form-container">

        <h2>Please tell us about yourself</h2>

        <p class="subtitle">
            Fill out the information below, then click Next to continue.
        </p>

        <form id="step1Form">

            <div class="form-grid">

                <div class="field">
                    <label>First name</label>
                    <input type="text" name="first_name" required>
                </div>

                <div class="field">
                    <label>Last name</label>
                    <input type="text" name="last_name" required>
                </div>

                <div class="field">
                    <label>Job Title</label>
                    <input type="text" name="job_title" required>
                </div>

                <div class="field">
                    <label>Company</label>
                    <input type="text" name="company" required>
                </div>

                <div class="field">
                    <label>Work Email Address</label>
                    <input type="email" name="email" required>
                </div>

                <div class="field">
                    <label>Mobile Phone</label>
                    <input type="text" name="phone" required>
                </div>

            </div>

            <h3 class="address-title">Address</h3>

            <div class="field full-width">
                <label>Street Address</label>
                <input type="text" name="street_address">
            </div>

            <div class="field full-width">
                <label>Address 2</label>
                <input type="text" name="address2">
            </div>

            <div class="form-grid">

                <div class="field">
                    <label>Country/Region</label>
                    <input type="text" name="country">
                </div>

                <div class="field">
                    <label>City/County</label>
                    <input type="text" name="city">
                </div>

                <div class="field">
                    <label>State/Province</label>
                    <input type="text" name="state">
                </div>

                <div class="field">
                    <label>ZIP/Postal code</label>
                    <input type="text" name="zip">
                </div>

            </div>

            <div class="button-wrap">
                <button type="button" id="nextBtn">
                    Next
                </button>
            </div>

        </form>

    </div>

</section>

<footer class="footer">

</footer>
  
</body>
</html>
