<!DOCTYPE html>
<html>
<head>

    <title>IDC Executive Dinner Registration</title>

  <style>

body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    color:#111;
}

.hero{
    background:#1f3faa;
    padding:80px 20px;
    color:white;
}

.hero-inner{
    max-width:800px;
    margin:auto;
}

.logo{
    width:90px;
    margin-bottom:30px;
}

.event-type{
    font-size:13px;
    font-weight:bold;
    letter-spacing:1px;
}

.hero h1{
    font-size:48px;
    line-height:1.2;
    margin:20px 0;
}

.event-date{
    font-size:22px;
    margin-bottom:30px;
}

.register-btn{
    background:#3d6cff;
    color:white;
    border:none;
    padding:14px 28px;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
}

.form-section{
    padding:80px 20px;
    max-width:1000px;
    margin:auto;
}

.footer{
    background:#2450d3;
    height:180px;
}

@media(max-width:768px){

    .hero h1{
        font-size:34px;
    }

    .event-date{
        font-size:18px;
    }

}

</style>

</head>

<body>

<header class="hero">

    <div class="hero-inner">

        <img src="logo.png" class="logo">

        <p class="event-type">EXECUTIVE DINNER</p>

        <h1>
            Scaling Agentic AI: From Experimentation to Enterprise Value Through Modernization and Trust
        </h1>

        <p class="event-date">
            Tuesday, May 19, 2026
        </p>

        <button class="register-btn">
            Register Now
        </button>

    </div>

</header>

<section class="form-section">

</section>

<footer class="footer">

</footer>
  
</body>
</html>
